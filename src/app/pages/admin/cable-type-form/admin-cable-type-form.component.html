<div class="mx-auto max-w-2xl">
  <h1 class="text-platinum-100 mb-6 text-xl font-semibold tracking-tight sm:mb-8 sm:text-2xl">{{ pageTitle() }}</h1>

  <form (submit)="onSubmit($event)" novalidate>
    <section class="pb-8">
      <label class="block">
        <span class="text-platinum-70 mb-1.5 block text-sm font-medium">სახელი <span class="text-valencia-60">*</span></span>
        <app-input
          [formField]="typeForm.name"
          [error]="submitted() && typeForm.name().invalid()"
          customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
          type="text"
          placeholder="მაგ. Type-C To Type-C"
        />
      </label>
    </section>

    <div class="border-hairline-strong/50 flex flex-col-reverse gap-2 border-t pt-6 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancel()"
        class="text-platinum-80 border-hairline-strong/70 inline-flex h-11 w-full items-center justify-center rounded-lg border bg-white px-4 text-[15px] font-medium shadow-[0_1px_1px_rgba(33,33,33,0.04)] hover:bg-neutral-50 sm:h-10 sm:w-auto sm:text-sm"
      >
        გაუქმება
      </button>
      <button
        type="submit"
        [disabled]="isLoading()"
        class="bg-green-60 hover:bg-green-70 focus-visible:outline-green-60 inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg px-4 text-[15px] font-medium text-white shadow-[0_1px_1px_rgba(33,33,33,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:h-10 sm:w-auto sm:text-sm"
      >
        @if (isLoading()) {
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" class="animate-spin" aria-hidden="true">
            <path d="M8 2a6 6 0 1 1-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          ინახება...
        } @else {
          {{ isEditMode() ? 'შენახვა' : 'დამატება' }}
        }
      </button>
    </div>
  </form>
</div>
