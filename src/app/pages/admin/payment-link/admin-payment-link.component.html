<div class="mx-auto max-w-2xl space-y-4">
  <div class="pb-1">
    <h1 class="text-platinum-100 text-lg font-semibold">გადახდის ბმული</h1>
    <p class="text-platinum-50 mt-0.5 text-sm">
      შექმენით შეკვეთა და გაუგზავნეთ მომხმარებელს გადახდის ბმული (მოქმედებს ~10 საათი)
    </p>
  </div>

  @if (checkoutUrl(); as url) {
  <div class="border-hairline-strong/60 rounded-2xl border bg-white">
    <div class="border-hairline-strong/60 flex items-center justify-between gap-3 border-b px-5 py-3">
      <div class="text-green-70 flex items-center gap-2">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <path
            d="M16.667 5L7.5 14.167 3.333 10"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <h2 class="text-sm font-semibold">გადახდის ბმული შეიქმნა</h2>
      </div>
      <span class="text-platinum-50 truncate text-xs">შეკვეთის ID: {{ orderId() }}</span>
    </div>

    <div class="px-5 py-4">
      <label class="text-platinum-70 mb-1.5 block text-sm font-medium">ბმული</label>
      <div class="flex flex-col gap-2 sm:flex-row">
        <input
          type="text"
          readonly
          [value]="url"
          class="border-hairline-strong/60 text-platinum-100 h-10 w-full flex-1 rounded-xl border bg-white px-3.5 text-sm focus:outline-hidden"
        />
        <button
          type="button"
          (click)="copyLink()"
          class="bg-green-60 hover:bg-green-70 inline-flex h-10 shrink-0 items-center justify-center gap-1.5 rounded-full px-5 text-sm font-medium text-white transition-colors"
        >
          {{ copied() ? "დაკოპირდა" : "კოპირება" }}
        </button>
      </div>
    </div>

    <div class="border-hairline-strong/60 flex justify-end border-t px-5 py-3">
      <button
        type="button"
        (click)="reset()"
        class="border-hairline-strong/60 text-platinum-80 hover:bg-platinum-10/60 inline-flex h-9 items-center rounded-full border bg-white px-4 text-sm font-medium transition-colors"
      >
        ახალი ბმულის შექმნა
      </button>
    </div>
  </div>
  } @else {
  <form (submit)="onSubmit($event)" novalidate class="space-y-4">
    <div class="border-hairline-strong/60 rounded-2xl border bg-white">
      <div class="border-hairline-strong/60 border-b px-5 py-3">
        <h2 class="text-platinum-100 text-sm font-semibold">თანხა</h2>
      </div>
      <div class="px-5 py-4">
        <div class="sm:max-w-xs">
          <label class="text-platinum-70 mb-1.5 block text-sm font-medium">ასაღები თანხა (₾)</label>
          <app-input [formField]="paymentLinkForm.price" type="text" placeholder="0.00" />
        </div>
      </div>
    </div>

    <div class="border-hairline-strong/60 rounded-2xl border bg-white">
      <div class="border-hairline-strong/60 border-b px-5 py-3">
        <h2 class="text-platinum-100 text-sm font-semibold">კონტაქტი და მიწოდება</h2>
      </div>
      <div class="grid gap-4 px-5 py-4 sm:grid-cols-2">
        <div>
          <label class="text-platinum-70 mb-1.5 block text-sm font-medium">ელ. ფოსტა</label>
          <app-input [formField]="paymentLinkForm.email" type="email" placeholder="ელ. ფოსტა" />
        </div>
        <div>
          <label class="text-platinum-70 mb-1.5 block text-sm font-medium">ტელეფონი</label>
          <app-input
            [formField]="paymentLinkForm.phone_number"
            type="tel"
            placeholder="ტელეფონის ნომერი"
          />
        </div>
        <div class="sm:col-span-2">
          <label class="text-platinum-70 mb-1.5 block text-sm font-medium">მისამართი</label>
          <app-input [formField]="paymentLinkForm.address" type="text" placeholder="მისამართი" />
        </div>
      </div>
    </div>

    <div class="border-hairline-strong/60 rounded-2xl border bg-white">
      <div class="border-hairline-strong/60 border-b px-5 py-3">
        <h2 class="text-platinum-100 text-sm font-semibold">კომენტარი</h2>
      </div>
      <div class="px-5 py-4">
        <app-input [formField]="paymentLinkForm.comment" type="text" placeholder="კომენტარი" />
      </div>
    </div>

    <div class="flex items-center justify-end gap-2">
      <button
        type="submit"
        [disabled]="isLoading()"
        class="bg-green-60 hover:bg-green-70 inline-flex h-9 items-center gap-1.5 rounded-full px-5 text-sm font-medium text-white transition-colors disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isLoading()) {
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" class="animate-spin">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-opacity="0.25" />
          <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        მუშავდება...
        } @else {
        ბმულის შექმნა
        }
      </button>
    </div>
  </form>
  }
</div>
