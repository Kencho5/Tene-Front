<div class="mx-auto max-w-2xl">
  <h1 class="text-platinum-100 mb-6 text-xl font-semibold tracking-tight sm:text-2xl sm:mb-8">გადახდის ბმული</h1>

  @if (checkoutUrl(); as url) {
    <section class="border-hairline-strong/50 border-b pb-8">
      <div class="flex items-center gap-3">
        <span class="bg-green-60 flex size-10 shrink-0 items-center justify-center rounded-full text-white" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M16.667 5L7.5 14.167 3.333 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <div class="min-w-0">
          <h2 class="text-platinum-100 text-base font-semibold">ბმული შეიქმნა</h2>
          <p class="text-platinum-50 truncate text-[15px] tabular-nums sm:text-sm">შეკვეთა #{{ orderId() }}</p>
        </div>
      </div>

      <label class="mt-6 block">
        <span class="text-platinum-70 mb-1.5 block text-sm font-medium">ბმული</span>
        <div class="flex flex-col gap-2 sm:flex-row">
          <input
            type="text"
            readonly
            [value]="url"
            (focus)="$any($event.target).select()"
            class="border-hairline-strong/70 text-platinum-100 h-11 w-full min-w-0 flex-1 rounded-lg border bg-neutral-50 px-3 text-[15px] text-ellipsis shadow-[0_1px_1px_rgba(33,33,33,0.04)] focus:outline-hidden sm:h-10 sm:text-sm"
          />
          <button
            type="button"
            (click)="copyLink()"
            class="bg-green-60 hover:bg-green-70 focus-visible:outline-green-60 inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-lg px-4 text-[15px] font-medium text-white shadow-[0_1px_1px_rgba(33,33,33,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 sm:h-10 sm:text-sm"
          >
            @if (copied()) {
              <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M16.667 5L7.5 14.167 3.333 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              დაკოპირდა
            } @else {
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4" />
                <path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" stroke="currentColor" stroke-width="1.4" />
              </svg>
              კოპირება
            }
          </button>
        </div>
        <span class="text-platinum-50 mt-1.5 block text-[13px] sm:text-xs">ბმული მოქმედებს დაახლოებით 10 საათი</span>
      </label>
    </section>

    <div class="flex flex-col pt-6 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="reset()"
        class="text-platinum-80 border-hairline-strong/70 inline-flex h-11 w-full items-center justify-center rounded-lg border bg-white px-4 text-[15px] font-medium shadow-[0_1px_1px_rgba(33,33,33,0.04)] hover:bg-neutral-50 sm:h-10 sm:w-auto sm:text-sm"
      >
        ახალი ბმული
      </button>
    </div>
  } @else {
    <form (submit)="onSubmit($event)" novalidate>
      <section class="border-hairline-strong/50 border-b pb-8">
        <h2 class="text-platinum-100 text-base font-semibold">თანხა</h2>
        <label class="mt-4 block sm:max-w-xs">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">ასაღები თანხა (₾)</span>
          <app-input
            [formField]="paymentLinkForm.price"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="text"
            placeholder="0.00"
          />
        </label>
      </section>

      <section class="border-hairline-strong/50 border-b py-8">
        <h2 class="text-platinum-100 text-base font-semibold">კონტაქტი და მიწოდება</h2>
        <div class="mt-4 grid gap-4 *:min-w-0 sm:grid-cols-2">
          <label class="block">
            <span class="text-platinum-70 mb-1.5 block text-sm font-medium">ელ. ფოსტა</span>
            <app-input
              [formField]="paymentLinkForm.email"
              customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
              type="email"
              placeholder="name@example.com"
            />
          </label>
          <label class="block">
            <span class="text-platinum-70 mb-1.5 block text-sm font-medium">ტელეფონი</span>
            <app-input
              [formField]="paymentLinkForm.phone_number"
              customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
              type="tel"
              placeholder="5XX XXX XXX"
            />
          </label>
          <label class="block sm:col-span-2">
            <span class="text-platinum-70 mb-1.5 block text-sm font-medium">მისამართი</span>
            <app-input
              [formField]="paymentLinkForm.address"
              customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
              type="text"
              placeholder="ქალაქი, ქუჩა, ბინა"
            />
          </label>
        </div>
      </section>

      <section class="py-8">
        <h2 class="text-platinum-100 text-base font-semibold">კომენტარი</h2>
        <label class="mt-4 block">
          <span class="sr-only">კომენტარი</span>
          <app-input
            [formField]="paymentLinkForm.comment"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="text"
            placeholder="შენიშვნა შეკვეთაზე"
          />
        </label>
      </section>

      <div class="border-hairline-strong/50 flex flex-col gap-2 border-t pt-6 sm:flex-row sm:items-center sm:justify-between">
        <p class="text-platinum-50 text-[13px] sm:text-xs">ბმული მოქმედებს დაახლოებით 10 საათი</p>
        <button
          type="submit"
          [disabled]="isLoading()"
          class="bg-green-60 hover:bg-green-70 focus-visible:outline-green-60 order-first inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg px-4 text-[15px] font-medium text-white shadow-[0_1px_1px_rgba(33,33,33,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:order-none sm:h-10 sm:w-auto sm:text-sm"
        >
          @if (isLoading()) {
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" class="animate-spin" aria-hidden="true">
              <path d="M8 2a6 6 0 1 1-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            იქმნება...
          } @else {
            ბმულის შექმნა
          }
        </button>
      </div>
    </form>
  }
</div>
