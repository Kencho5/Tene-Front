<div class="mx-auto max-w-2xl">
  <div class="mb-6 sm:mb-8">
    <h1 class="text-platinum-100 text-xl font-semibold tracking-tight sm:text-2xl">{{ pageTitle() }}</h1>
    @if (cableType()) {
      <p class="text-platinum-50 mt-1 text-sm">{{ cableType()!.name }}</p>
    }
  </div>

  <form (submit)="onSubmit($event)" novalidate>
    <section class="pb-8">
      <div class="grid gap-4 *:min-w-0 sm:grid-cols-2">
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">სიმძლავრე (W) <span class="text-valencia-60">*</span></span>
          <app-input
            [formField]="variantForm.watts"
            [error]="submitted() && variantForm.watts().invalid()"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="number"
            placeholder="60"
          />
        </label>
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">სიგრძე (სმ) <span class="text-valencia-60">*</span></span>
          <app-input
            [formField]="variantForm.length_cm"
            [error]="submitted() && variantForm.length_cm().invalid()"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="number"
            placeholder="100"
          />
        </label>
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">ფასი (₾) <span class="text-valencia-60">*</span></span>
          <app-input
            [formField]="variantForm.price"
            [error]="submitted() && variantForm.price().invalid()"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="text"
            placeholder="25.00"
          />
        </label>
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">გარანტია (თვე) <span class="text-valencia-60">*</span></span>
          <app-input
            [formField]="variantForm.warranty_months"
            [error]="submitted() && variantForm.warranty_months().invalid()"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="number"
            placeholder="12"
          />
        </label>
      </div>
    </section>

    <div class="border-hairline-strong/50 flex flex-col-reverse gap-2 border-t pt-6 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancel()"
        class="text-platinum-80 border-hairline-strong/70 inline-flex h-11 w-full items-center justify-center rounded-lg border bg-white px-4 text-[15px] font-medium shadow-[0_1px_1px_rgba(33,33,33,0.04)] hover:bg-neutral-50 sm:h-10 sm:w-auto sm:text-sm"
      >
        გაუქმება
      </button>
      <button
        type="submit"
        [disabled]="isLoading()"
        class="bg-green-60 hover:bg-green-70 focus-visible:outline-green-60 inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg px-4 text-[15px] font-medium text-white shadow-[0_1px_1px_rgba(33,33,33,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:h-10 sm:w-auto sm:text-sm"
      >
        @if (isLoading()) {
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" class="animate-spin" aria-hidden="true">
            <path d="M8 2a6 6 0 1 1-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          ინახება...
        } @else {
          {{ isEditMode() ? 'შენახვა' : 'დამატება' }}
        }
      </button>
    </div>
  </form>
</div>
