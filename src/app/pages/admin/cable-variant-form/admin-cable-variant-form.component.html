<div class="mx-auto max-w-2xl space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold text-platinum-100">{{ pageTitle() }}</h1>
      <p class="mt-0.5 text-sm text-platinum-50">
        @if (cableType()) {
          ტიპი: {{ cableType()!.name }}
        }
        @if (isEditMode()) {
          · ID: {{ variantId() }}
        }
      </p>
    </div>
  </div>

  <form (submit)="onSubmit($event)" novalidate class="space-y-4">
    <div class="rounded-2xl border border-hairline-strong/60 bg-white">
      <div class="border-b border-hairline-strong/60 px-5 py-3">
        <h2 class="text-sm font-semibold text-platinum-100">ვარიანტის დეტალები</h2>
      </div>
      <div class="px-5 py-4">

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">სიმძლავრე (W) *</label>
          <app-input
            [formField]="variantForm.watts"
            [error]="submitted() && variantForm.watts().invalid()"
            type="number"
            placeholder="W"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">სიგრძე (სმ) *</label>
          <app-input
            [formField]="variantForm.length_cm"
            [error]="submitted() && variantForm.length_cm().invalid()"
            type="number"
            placeholder="სმ"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">ფასი (₾) *</label>
          <app-input
            [formField]="variantForm.price"
            [error]="submitted() && variantForm.price().invalid()"
            type="text"
            placeholder="25.00"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">გარანტია (თვე) *</label>
          <app-input
            [formField]="variantForm.warranty_months"
            [error]="submitted() && variantForm.warranty_months().invalid()"
            type="number"
            placeholder="თვე"
          />
        </div>
      </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2">
      <button
        type="button"
        (click)="cancel()"
        class="inline-flex h-9 items-center rounded-full border border-hairline-strong/60 bg-white px-4 text-sm font-medium text-platinum-80 transition-colors hover:bg-platinum-10/60"
      >
        გაუქმება
      </button>
      <button
        type="submit"
        [disabled]="isLoading()"
        class="inline-flex h-9 items-center gap-1.5 rounded-full bg-green-60 px-5 text-sm font-medium text-white transition-colors hover:bg-green-70 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isLoading()) {
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" class="animate-spin">
            <path
              d="M8 2V4M8 12V14M14 8H12M4 8H2M12.2426 3.75736L10.8284 5.17157M5.17157 10.8284L3.75736 12.2426M12.2426 12.2426L10.8284 10.8284M5.17157 5.17157L3.75736 3.75736"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span>მუშავდება...</span>
        } @else {
          <span>{{ isEditMode() ? "განახლება" : "დამატება" }}</span>
        }
      </button>
    </div>
  </form>
</div>
