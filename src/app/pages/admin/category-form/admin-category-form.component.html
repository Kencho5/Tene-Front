<div class="mx-auto max-w-2xl space-y-4">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold text-platinum-100">
        {{ pageTitle() }}
      </h1>
      <p class="mt-0.5 text-sm text-platinum-50">
        @if (isEditMode()) {
          კატეგორიის ID: {{ categoryId() }}
        } @else {
          შეავსეთ ყველა სავალდებულო ველი
        }
      </p>
    </div>
  </div>

  <!-- Form -->
  <form (submit)="onSubmit($event)" novalidate class="space-y-4">
    <!-- Basic Information Card -->
    <div class="rounded-2xl border border-hairline-strong/60 bg-white">
      <div class="border-b border-hairline-strong/60 px-5 py-3">
        <h2 class="text-sm font-semibold text-platinum-100">ძირითადი ინფორმაცია</h2>
      </div>

      <div class="flex flex-col gap-4 px-5 py-4">
        <div>
        <label class="mb-1.5 block text-sm font-medium text-platinum-70">სახელი *</label>
        <app-input
          [formField]="categoryForm.name"
          [error]="submitted() && categoryForm.name().invalid()"
          type="text"
          placeholder="კატეგორიის სახელი"
          (input)="onNameInput($event)"
        />
        </div>

        <div>
        <label class="mb-1.5 block text-sm font-medium text-platinum-70">სლაგი (URL) *</label>
        <app-input
          [formField]="categoryForm.slug"
          [error]="submitted() && categoryForm.slug().invalid()"
          type="text"
          placeholder="category-slug"
        />
        </div>

        <!-- Parent Category -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">
            მშობელი კატეგორია
          </label>
          <app-combobox
            [selectedValue]="selectedParentValue()"
            (selectedValueChange)="onParentCategoryChange($event)"
            [items]="categoryOptions()"
            placeholder="აირჩიეთ მშობელი კატეგორია"
            searchPlaceholder="ძიება..."
            notFoundText="კატეგორია ვერ მოიძებნა"
          />
        </div>

        <div>
        <label class="mb-1.5 block text-sm font-medium text-platinum-70">აღწერა</label>
        <textarea
          [formField]="categoryForm.description"
          rows="4"
          placeholder="კატეგორიის დეტალური აღწერა"
          class="w-full resize-none rounded-xl border border-hairline-strong/60 bg-white px-3.5 py-2.5 text-sm text-platinum-100 placeholder:text-platinum-40 outline-hidden focus:border-platinum-30 focus:ring-1 focus:ring-platinum-40"
        ></textarea>
        </div>

        <!-- Category Image -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">
            კატეგორიის სურათი
          </label>

          @if (imagePreview()) {
            <div class="relative mb-3 w-full max-w-xs">
              <img
                [src]="imagePreview()"
                alt="Category preview"
                class="h-48 w-full rounded-xl border border-hairline-strong/60 object-cover"
              />
              <button
                type="button"
                (click)="removeImage()"
                class="absolute right-2 top-2 flex h-7 w-7 items-center justify-center rounded-full bg-valencia-60 text-white transition-opacity hover:bg-valencia-70"
                aria-label="წაშლა"
              >
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M12 4L4 12M4 4L12 12"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          } @else {
            <label
              for="category-image"
              class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-hairline-strong/60 bg-platinum-10 px-6 py-8 transition-colors hover:border-green-60 hover:bg-green-10"
            >
              <svg
                width="40"
                height="40"
                viewBox="0 0 48 48"
                fill="none"
                class="mb-3 text-platinum-40"
              >
                <path
                  d="M24 32V16M16 24H32M42 24C42 33.9411 33.9411 42 24 42C14.0589 42 6 33.9411 6 24C6 14.0589 14.0589 6 24 6C33.9411 6 42 14.0589 42 24Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
              <p class="mb-1 text-sm font-medium text-platinum-70">
                დააჭირეთ სურათის ასატვირთად
              </p>
              <p class="text-xs text-platinum-50">PNG, JPG, WEBP (მაქს. 5MB)</p>
            </label>
            <input
              id="category-image"
              type="file"
              accept="image/*"
              (change)="onImageSelect($event)"
              class="hidden"
            />
          }
        </div>

        <div>
        <label class="mb-1.5 block text-sm font-medium text-platinum-70">ჩვენების რიგი</label>
        <app-input
          [formField]="categoryForm.display_order"
          type="number"
          placeholder="0"
        />
        </div>

        <!-- Enabled Toggle -->
        <div class="flex items-center justify-between border-t border-hairline-strong/60 pt-4">
          <div>
            <p class="text-sm font-medium text-platinum-100">სტატუსი</p>
            <p class="text-xs text-platinum-50">
              გააქტიურებული კატეგორია გამოჩნდება საიტზე
            </p>
          </div>
          <button
            type="button"
            (click)="toggleEnabled()"
            class="relative inline-flex h-[22px] w-10 items-center rounded-full transition-colors focus:outline-hidden focus:ring-2 focus:ring-green-60 focus:ring-offset-2"
            [class.bg-green-60]="categoryModel().enabled"
            [class.bg-platinum-30]="!categoryModel().enabled"
            [attr.aria-label]="categoryModel().enabled ? 'გამორთვა' : 'ჩართვა'"
          >
            <span
              class="inline-block h-4 w-4 transform rounded-full bg-white shadow-xs transition-transform"
              [class.translate-x-[21px]]="categoryModel().enabled"
              [class.translate-x-[3px]]="!categoryModel().enabled"
            ></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="flex items-center justify-end gap-2">
      <button
        type="button"
        (click)="cancel()"
        class="inline-flex h-9 items-center rounded-full border border-hairline-strong/60 bg-white px-4 text-sm font-medium text-platinum-80 transition-colors hover:bg-platinum-10/60"
      >
        გაუქმება
      </button>
      <button
        type="submit"
        [disabled]="isLoading()"
        class="inline-flex h-9 items-center gap-1.5 rounded-full bg-green-60 px-5 text-sm font-medium text-white transition-colors hover:bg-green-70 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isLoading()) {
          <svg
            width="15"
            height="15"
            viewBox="0 0 16 16"
            fill="none"
            class="animate-spin"
          >
            <path
              d="M8 2V4M8 12V14M14 8H12M4 8H2M12.2426 3.75736L10.8284 5.17157M5.17157 10.8284L3.75736 12.2426M12.2426 12.2426L10.8284 10.8284M5.17157 5.17157L3.75736 3.75736"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span>მუშავდება...</span>
        } @else {
          <span>{{ isEditMode() ? "განახლება" : "დამატება" }}</span>
        }
      </button>
    </div>
  </form>
</div>
