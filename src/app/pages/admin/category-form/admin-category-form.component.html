<div class="mx-auto max-w-2xl">
  <h1 class="text-platinum-100 mb-6 text-xl font-semibold tracking-tight sm:mb-8 sm:text-2xl">{{ pageTitle() }}</h1>

  <form (submit)="onSubmit($event)" novalidate>
    <section class="border-hairline-strong/50 border-b pb-8">
      <h2 class="text-platinum-100 text-base font-semibold">ძირითადი</h2>
      <div class="mt-4 grid gap-4 *:min-w-0 sm:grid-cols-2">
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">სახელი <span class="text-valencia-60">*</span></span>
          <app-input
            [formField]="categoryForm.name"
            [error]="submitted() && categoryForm.name().invalid()"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="text"
            placeholder="კატეგორიის სახელი"
            (input)="onNameInput($event)"
          />
        </label>
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">სლაგი <span class="text-valencia-60">*</span></span>
          <app-input
            [formField]="categoryForm.slug"
            [error]="submitted() && categoryForm.slug().invalid()"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 !font-mono shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="text"
            placeholder="category-slug"
          />
        </label>
        <div>
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">მშობელი კატეგორია</span>
          <app-combobox
            [selectedValue]="selectedParentValue()"
            (selectedValueChange)="onParentCategoryChange($event)"
            [items]="categoryOptions()"
            placeholder="არ არის"
            searchPlaceholder="ძიება..."
            notFoundText="კატეგორია ვერ მოიძებნა"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !border-hairline-strong/70 !px-3 !shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
          />
        </div>
        <label class="block">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">რიგი</span>
          <app-input
            [formField]="categoryForm.display_order"
            customClass="!h-11 sm:!h-10 !text-[15px] sm:!text-sm !rounded-lg !px-3 shadow-[0_1px_1px_rgba(33,33,33,0.04)]"
            type="number"
            placeholder="0"
          />
        </label>
        <label class="block sm:col-span-2">
          <span class="text-platinum-70 mb-1.5 block text-sm font-medium">აღწერა</span>
          <textarea
            [formField]="categoryForm.description"
            rows="4"
            placeholder="კატეგორიის აღწერა"
            class="border-hairline-strong/70 text-platinum-100 placeholder:text-platinum-50 focus:border-green-60 focus:ring-green-60/15 block w-full resize-y rounded-lg border bg-white px-3 py-2.5 text-[15px] shadow-[0_1px_1px_rgba(33,33,33,0.04)] outline-hidden focus:ring-3 sm:text-sm"
          ></textarea>
        </label>
      </div>
    </section>

    <section class="border-hairline-strong/50 border-b py-8">
      <h2 class="text-platinum-100 text-base font-semibold">სურათი</h2>
      @if (imagePreview()) {
        <div class="border-hairline-strong/50 relative mt-4 aspect-square w-40 overflow-hidden rounded-lg border bg-neutral-50">
          <img [src]="imagePreview()" alt="კატეგორიის სურათი" class="size-full object-cover" />
          <button
            type="button"
            (click)="removeImage()"
            aria-label="სურათის წაშლა"
            class="text-platinum-70 hover:text-valencia-60 absolute top-1.5 right-1.5 flex size-9 items-center justify-center rounded-md bg-white/90 shadow-[0_0_0_1px_rgba(33,33,33,0.08)] sm:size-7"
          >
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.67 4h10.66M6.33 4V2.67h3.34V4M4 4l.67 9.33h6.66L12 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      } @else {
        <label
          for="category-image"
          class="border-hairline-strong hover:border-green-60 mt-4 flex cursor-pointer flex-col items-center justify-center rounded-lg border border-dashed bg-neutral-50 px-6 py-8 text-center hover:bg-white"
        >
          <span class="border-hairline-strong/70 text-platinum-60 flex size-10 items-center justify-center rounded-full border bg-white shadow-[0_1px_1px_rgba(33,33,33,0.04)]">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 10.5V3m0 0L5 6m3-3 3 3M3 10.5v1A1.5 1.5 0 0 0 4.5 13h7a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="text-platinum-90 mt-3 text-[15px] font-medium sm:text-sm">აირჩიეთ სურათი</span>
          <span class="text-platinum-50 mt-0.5 text-sm sm:text-[13px]">PNG, JPG, WEBP, მაქს. 5MB</span>
        </label>
        <input id="category-image" type="file" accept="image/*" (change)="onImageSelect($event)" class="sr-only" />
      }
    </section>

    <section class="py-8">
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="categoryModel().enabled"
        (click)="toggleEnabled()"
        class="border-hairline-strong/70 flex min-h-14 w-full items-center justify-between gap-3 rounded-lg border bg-white px-4 py-3 text-left"
      >
        <span class="min-w-0">
          <span class="text-platinum-90 block text-[15px] sm:text-sm">აქტიური</span>
          <span class="text-platinum-50 block text-[13px] sm:text-xs">ჩანს საიტზე</span>
        </span>
        <span class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors" [class]="categoryModel().enabled ? 'bg-green-60' : 'bg-neutral-300'" aria-hidden="true">
          <span class="inline-block size-4 rounded-full bg-white shadow-[0_1px_2px_rgba(33,33,33,0.2)] transition-transform" [class]="categoryModel().enabled ? 'translate-x-[18px]' : 'translate-x-0.5'"></span>
        </span>
      </button>
    </section>

    <div class="border-hairline-strong/50 flex flex-col-reverse gap-2 border-t pt-6 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancel()"
        class="text-platinum-80 border-hairline-strong/70 inline-flex h-11 w-full items-center justify-center rounded-lg border bg-white px-4 text-[15px] font-medium shadow-[0_1px_1px_rgba(33,33,33,0.04)] hover:bg-neutral-50 sm:h-10 sm:w-auto sm:text-sm"
      >
        გაუქმება
      </button>
      <button
        type="submit"
        [disabled]="isLoading()"
        class="bg-green-60 hover:bg-green-70 focus-visible:outline-green-60 inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg px-4 text-[15px] font-medium text-white shadow-[0_1px_1px_rgba(33,33,33,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:h-10 sm:w-auto sm:text-sm"
      >
        @if (isLoading()) {
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" class="animate-spin" aria-hidden="true">
            <path d="M8 2a6 6 0 1 1-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          ინახება...
        } @else {
          {{ isEditMode() ? 'შენახვა' : 'დამატება' }}
        }
      </button>
    </div>
  </form>
</div>
