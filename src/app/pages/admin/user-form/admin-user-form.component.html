<div class="mx-auto max-w-2xl space-y-4">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold text-platinum-100">
        მომხმარებლის რედაქტირება
      </h1>
      <p class="mt-0.5 text-sm text-platinum-50">
        მომხმარებლის ID: {{ userId() }}
      </p>
    </div>
  </div>

  <!-- Form -->
  <form (submit)="onSubmit(); $event.preventDefault()" novalidate class="space-y-4">
    <div class="rounded-2xl border border-hairline-strong/60 bg-white">
      <div class="border-b border-hairline-strong/60 px-5 py-3">
        <h2 class="text-sm font-semibold text-platinum-100">მომხმარებლის ინფორმაცია</h2>
      </div>

      <div class="flex flex-col gap-4 px-5 py-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">სახელი *</label>
          <app-input [formField]="userForm.name" type="text" placeholder="სახელი" />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">ელ-ფოსტა *</label>
          <app-input [formField]="userForm.email" type="email" placeholder="ელ-ფოსტა" />
        </div>

        <!-- Role -->
        <div>
          <label for="role" class="mb-1.5 block text-sm font-medium text-platinum-70">
            როლი *
          </label>
          <app-dropdown
            [selectedValue]="userModel().role"
            (selectedValueChange)="onRoleChange($event)"
            [items]="roleOptions"
            placeholder="აირჩიეთ როლი"
          />
        </div>

        <!-- Delivery price -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-platinum-70">
            მიწოდების ფასი (₾)
          </label>
          <app-input
            [formField]="userForm.deliveryPrice"
            type="number"
            placeholder="მიწოდების ფასი"
          />
          <p class="mt-1 text-xs text-platinum-50">
            ცარიელი ველი — სტანდარტული მიწოდების ფასი
          </p>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-2">
      <button
        type="button"
        (click)="cancel()"
        class="inline-flex h-9 items-center rounded-full border border-hairline-strong/60 bg-white px-4 text-sm font-medium text-platinum-80 transition-colors hover:bg-platinum-10/60"
      >
        გაუქმება
      </button>
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="inline-flex h-9 items-center gap-1.5 rounded-full bg-green-60 px-5 text-sm font-medium text-white transition-colors hover:bg-green-70 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isSubmitting()) {
          <span>შენახვა...</span>
        } @else {
          <span>შენახვა</span>
        }
      </button>
    </div>
  </form>
</div>
