@if (mobileSidebarOpen()) {
  <div
    (click)="mobileSidebarOpen.set(false)"
    class="fixed inset-0 z-40 bg-platinum-100/30 backdrop-blur-[1px] lg:hidden"
    aria-hidden="true"
  ></div>
}

<div class="flex h-dvh overflow-hidden bg-neutral-50">
  <app-admin-sidebar
    [sections]="navSections()"
    [(collapsed)]="sidebarCollapsed"
    [(mobileOpen)]="mobileSidebarOpen"
  />

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden bg-white">
    <app-admin-header
      [sections]="navSections()"
      [user]="user()"
      (menuToggle)="mobileSidebarOpen.set(true)"
      (logout)="logout()"
    />

    <main class="relative flex-1 overflow-y-auto p-4 sm:p-6 lg:px-8 lg:py-7">
      @if (!loadingService.loading()) {
        <router-outlet />
      } @else {
        <div class="absolute inset-0 flex items-center justify-center">
          <app-spinner [size]="46" [textColor]="'text-platinum-100'" [fillColor]="'fill-green-60'" />
        </div>
      }
    </main>
  </div>
</div>
